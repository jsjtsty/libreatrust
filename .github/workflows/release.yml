name: Rust Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: libreatrust-release-${{ matrix.name }}

      - name: Build release artifacts
        run: cargo build --workspace --release --locked

      - name: Package Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/libreatrust-${{ matrix.name }}"
          cp target/release/libreatrust.a "dist/libreatrust-${{ matrix.name }}/"
          cp target/release/libreatrust.dylib "dist/libreatrust-${{ matrix.name }}/" 2>/dev/null || \
            cp target/release/libreatrust.so "dist/libreatrust-${{ matrix.name }}/"
          cp include/libreatrust.h "dist/libreatrust-${{ matrix.name }}/"
          tar -C dist -czf "libreatrust-${{ matrix.name }}.tar.gz" "libreatrust-${{ matrix.name }}"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/libreatrust-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item target/release/libreatrust.lib $package
          Copy-Item target/release/libreatrust.dll $package
          Copy-Item include/libreatrust.h $package
          Compress-Archive -Path $package -DestinationPath "libreatrust-${{ matrix.name }}.zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: libreatrust-${{ matrix.name }}
          path: |
            libreatrust-${{ matrix.name }}.tar.gz
            libreatrust-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: libreatrust-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
