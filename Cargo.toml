[package]
name = "reatrust"
version = "0.3.5"
edition = "2024"
build = "build.rs"

[workspace]
members = ["crates/libreatrust-core"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"

[dependencies]
libreatrust-core = { path = "crates/libreatrust-core" }
